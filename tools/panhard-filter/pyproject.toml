[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panhard-filter"
version = "0.1.0"
description = "Drop the least important file according to panhard-xz until diversity falls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
panhard-filter = "panhard_filter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panhard_filter = ["panhard-xz"]
