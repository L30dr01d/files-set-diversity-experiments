[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random-filter"
version = "0.1.0"
description = "Random-removal filtration driven by a caller-supplied diversity measure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "kneefinder @ git+https://github.com/mberman99/kneefinder_edited.git@dc882f0354c90a254e31279c3f4b6a56c4c99f58",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
