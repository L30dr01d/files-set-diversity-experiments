name: Experiments

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}@${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - id: generate
        run: |
          {
            echo 'matrix<<EOF'
            uv run python -m experiment_runner matrix
            echo EOF
          } >> "$GITHUB_OUTPUT"

  experiment:
    name: ${{ matrix.id }}
    needs: matrix
    if: needs.matrix.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.2
      - run: sudo apt-get update && sudo apt-get install -y bc
      - run: uv sync --extra fastr
      - run: uv run python -m experiment_runner run "$EXPERIMENT_ID"
        env:
          EXPERIMENT_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.id }}
          path: |
            output/${{ matrix.id }}.png
            output/${{ matrix.id }}.svg
          if-no-files-found: error

  site:
    name: Build gallery
    needs: [matrix, experiment]
    if: >-
      ${{ always() && !cancelled() && needs.matrix.result == 'success' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - uses: actions/download-artifact@v8.0.2
        if: needs.experiment.result != 'skipped'
        continue-on-error: true
        with:
          path: site/public/plots
          merge-multiple: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install site dependencies
        working-directory: site
        # shortcut: transitive dependencies are unlocked, use npm ci once a lockfile is committed.
        run: npm install
      - name: Test gallery
        working-directory: site
        run: npm test
      - name: Build gallery
        working-directory: site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish gallery
    needs: site
    if: >-
      success() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
