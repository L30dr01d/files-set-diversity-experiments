[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-experiments"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "psutil>=5.9.5",
    "matplotlib>=3.8",
    "poisson-measure",
    "ncd1-measure",
    "levassor-measure",
    "fast-filter",
    "random-filter",
    "panhard-measure",
]

[project.optional-dependencies]
fastr = ["fast-filter[fastr]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["tools/*"]
exclude = ["tools/__pycache__"]

[tool.uv.sources]
poisson-measure = { workspace = true }
ncd1-measure = { workspace = true }
levassor-measure = { workspace = true }
fast-filter = { workspace = true }
random-filter = { workspace = true }
panhard-measure = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "tools"]
